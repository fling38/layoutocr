[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fling38-layoutocr"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别OCR 的版面还原上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fling38" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fling38.github.io"
Repository = "https://github.com/fling38/layoutocr"
Issues = "https://github.com/fling38/layoutocr/issues"

[project.scripts]
layoutocr = "layoutocr:main"

[tool.setuptools]
py-modules = ["layoutocr"]
